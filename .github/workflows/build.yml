name: Build Music Look

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sortier-Logik testen (ffmpeg erzeugt echte MP3-Testdateien)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          cd tools && python3 -m unittest test_sort_inbox

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build Jellyfin.Plugin.MusicLook/Jellyfin.Plugin.MusicLook.csproj -c Release -o out

      - name: Package
        run: |
          VERSION="0.1.0.0"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          mkdir pkg
          cp out/Jellyfin.Plugin.MusicLook.dll pkg/
          (cd pkg && zip -r "../musiclook_${VERSION}.zip" .)
          md5sum "musiclook_${VERSION}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: musiclook
          path: musiclook_*.zip

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" musiclook_*.zip --title "${GITHUB_REF_NAME}" --notes "Music Look ${GITHUB_REF_NAME}"
